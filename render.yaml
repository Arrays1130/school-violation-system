# Render Blueprint — VioTrack (FREE TIER)
# Matches production: https://school-violation-system.onrender.com
#
# Stack: Render Web (free) + Render PostgreSQL (free) + database queue/cache/session.
# No paid Worker or Redis required — queue runs inside the web container (see Dockerfile).
#
# Cloudflare: optional DNS proxy in front of Render (orange cloud). Set APP_URL to your
# custom domain if you use one. Laravel already trusts proxies (bootstrap/app.php).
#
# Local Laragon uses MySQL; production on Render uses PostgreSQL (Render's only free DB).

databases:
  - name: viotrack-db
    databaseName: viotrack
    user: viotrack
    plan: free

services:
  - type: web
    name: school-violation-system
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: VioTrack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: viotrack-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: STUDENT_REGISTRATION_ENABLED
        value: "false"
      - key: ATTACHMENTS_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: ENABLE_SMS_GATEWAY
        value: "false"
      # Set in Render dashboard after deploy:
      # APP_URL=https://school-violation-system.onrender.com  (or your Cloudflare custom domain)
      # MAIL_* or GOOGLE_APPS_SCRIPT_URL, GEMINI_API_KEY, SMS_*, FCM_SERVER_KEY
      # CLOUDINARY_* if using cloudinary for attachments (free tier friendly)
